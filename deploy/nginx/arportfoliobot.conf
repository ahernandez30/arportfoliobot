# arportfoliobot.com — installed as /etc/nginx/sites-available/arportfoliobot by deploy.sh.
# Certificate: Let's Encrypt, managed by certbot (cert name arportfoliobot.com).

server_tokens off;

# Sign-in and invite endpoints: at most 10 requests a minute per address (bursts of 10).
# The backend also locks an email after 5 wrong attempts in 15 minutes.
limit_req_zone $binary_remote_addr zone=arpb_auth:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain HTTP: send everything to the HTTPS main site.
server {
    listen 80;
    server_name arportfoliobot.com www.arportfoliobot.com;
    return 301 https://arportfoliobot.com$request_uri;
}

# www over HTTPS: redirect to the main site.
server {
    listen 443 ssl http2;
    server_name www.arportfoliobot.com;

    ssl_certificate /etc/letsencrypt/live/arportfoliobot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arportfoliobot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://arportfoliobot.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name arportfoliobot.com;

    ssl_certificate /etc/letsencrypt/live/arportfoliobot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arportfoliobot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://arportfoliobot.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /var/www/arportfoliobot;
    index index.html;
    client_max_body_size 5m;

    location /api/auth/ {
        limit_req zone=arpb_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A backtest over years of 30-minute candles, with the luck test, can take a few minutes.
    location = /api/backtest/run {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10m;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Built files have content hashes in their names, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The app itself: always check for a fresh copy.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://arportfoliobot.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
